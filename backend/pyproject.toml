[project]
name = "aidat-backend"
version = "0.1.0"
description = "Ortabahçe aidat yönetim sistemi - API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
